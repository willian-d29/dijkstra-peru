<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas del Perú</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <aside id="panel">

    <div id="panel-header">
      <span class="eyebrow">Algoritmos de rutas</span>
      <h1>Rutas del Perú</h1>
      <p class="subtitle">Dijkstra y Agente Viajero con algoritmo genético simple</p>
    </div>

    <div id="mode-switch" class="mode-switch" role="tablist" aria-label="Modo de cálculo">
      <button id="mode-dijkstra" class="mode-btn active" type="button" data-mode="dijkstra">Dijkstra</button>
      <button id="mode-tsp" class="mode-btn" type="button" data-mode="tsp">Agente viajero</button>
    </div>

    <section id="dijkstra-controls" class="mode-panel">
      <div class="section-title">
        <span>Ruta más corta</span>
      </div>

      <div class="control-group">
        <label for="select-origin">Origen</label>
        <select id="select-origin">
          <option value="">Selecciona ciudad</option>
        </select>
      </div>

      <div class="control-group">
        <label for="select-dest">Destino</label>
        <select id="select-dest">
          <option value="">Selecciona ciudad</option>
        </select>
      </div>
    </section>

    <section id="tsp-controls" class="mode-panel hidden">
      <div class="section-title">
        <span>Agente viajero</span>
        <strong id="tsp-selected-count">0 ciudades</strong>
      </div>

      <div class="control-group">
        <label for="select-tsp-origin">Ciudad inicial</label>
        <select id="select-tsp-origin">
          <option value="">Selecciona ciudad</option>
        </select>
      </div>

      <div class="control-group">
        <div class="label-row">
          <label>Ciudades a visitar</label>
          <div class="mini-actions">
            <button id="btn-tsp-all" type="button">Todas</button>
            <button id="btn-tsp-clear" type="button">Limpiar</button>
          </div>
        </div>
        <div id="tsp-city-list" class="city-list" aria-label="Ciudades a visitar"></div>
      </div>

      <label class="check-row" for="tsp-return-origin">
        <input type="checkbox" id="tsp-return-origin" checked />
        <span>Volver al origen</span>
      </label>

      <div class="ga-grid">
        <div class="control-group compact">
          <label for="ga-population">Población</label>
          <input id="ga-population" type="number" min="20" max="500" step="10" value="80" />
        </div>

        <div class="control-group compact">
          <label for="ga-generations">Generaciones</label>
          <input id="ga-generations" type="number" min="20" max="1200" step="10" value="180" />
        </div>

        <div class="control-group compact">
          <label for="ga-mutation">Mutación %</label>
          <input id="ga-mutation" type="number" min="1" max="80" step="1" value="8" />
        </div>
      </div>
    </section>

    <div class="control-group speed-group">
      <label for="speed-slider">
        Velocidad de animación:
        <span id="speed-label">Normal</span>
      </label>
      <input type="range" id="speed-slider" min="1" max="3" value="2" step="1" />
    </div>

    <div id="btn-group">
      <button id="btn-run">Calcular ruta</button>
      <button id="btn-reset" class="secondary">Limpiar</button>
    </div>

    <div id="result-box" class="hidden">
      <div id="result-mode">Resultado</div>
      <div class="result-row">
        <span class="result-label">Distancia total</span>
        <span id="result-km" class="result-value">— km</span>
      </div>
      <div class="result-row">
        <span class="result-label">Ciudades en ruta</span>
        <span id="result-path" class="result-value">—</span>
      </div>
      <div id="result-meta"></div>
    </div>

    <div id="log-box">
      <p class="log-title">Pasos del algoritmo</p>
      <ul id="log-list">
        <li class="log-hint">Selecciona origen y destino para comenzar.</li>
      </ul>
    </div>

    <!-- Leyenda -->
    <div id="legend">
      <div class="legend-item">
        <span class="legend-dot origin"></span> Origen
      </div>
      <div class="legend-item">
        <span class="legend-dot dest"></span> Destino
      </div>
      <div class="legend-item">
        <span class="legend-dot visited"></span> Explorado
      </div>
      <div class="legend-item">
        <span class="legend-dot path"></span> Ruta óptima
      </div>
      <div class="legend-item">
        <span class="legend-line"></span> Conexión
      </div>
    </div>

  </aside>

  <main id="map-container">
    <div id="map"></div>
  </main>


  <script src="data.js"></script>

  
  <script src="app.js"></script>

  <!-- Google Maps JavaScript API    -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AQUI_TU_API_KEY&callback=initMap&language=es"
    async defer>
  </script>

</body>
</html>
